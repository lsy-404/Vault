<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherVault</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
  <link rel="stylesheet" href="/vendor/platform-kit-toast/toast.css">
  <link rel="stylesheet" href="/js/common.css">
  <script src="/vendor/platform-kit-toast/toast.browser.js"></script>
  <script src="/js/api.js"></script>
</head>
<body>
  <div id="app">
    <nav-bar v-if="showNav" @logout="onLogout" :show-database="showDatabase"></nav-bar>
    
    <div class="container" :class="{ 'full-height': !showNav }">
        <router-view 
            @login-success="onLoginSuccess"
            :auth-header="authHeader">
        </router-view>
    </div>

    <footer class="app-footer" v-if="showNav">
        <div>Powered by <a href="https://github.com/wuyilingwei/Vault" target="_blank" style="color: inherit; text-decoration: underline;">AetherVault</a></div>
    </footer>
  </div>

  <script src="/js/components/navbar.js"></script>
  <script src="/js/views/login.js"></script>
  <script src="/js/views/token.js"></script>
  <script src="/js/views/database.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
